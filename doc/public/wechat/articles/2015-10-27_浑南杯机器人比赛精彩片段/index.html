reen" allowfullscreen="true" frameborder="0" height="507.75" src="//v.qq.com/txp/iframe/player.html?origin=https%3A%2F%2Fmp.weixin.qq.com&amp;containerId=js_tx_video_container_0.33580881288525366&amp;vid=w01700ir7f8&amp;width=677&amp;height=507.75&amp;autoplay=false&amp;allowFullScreen=true&amp;chid=17&amp;full=true&amp;show1080p=false&amp;isDebugIframe=false" width="677"></iframe></span><br/></p><p><br/></p><p>两个比赛视频链接亲们好好看看吧</p><p><br/></p><p style="margin-top: 0px; margin-bottom: 0px; white-space: normal; padding: 0px; line-height: 25px; background-color: rgb(255, 255, 255);"><span style="font-family: 宋体;"><span style="color: rgb(0, 0, 255); letter-spacing: 0px; font-family: 楷体_GB2312; font-style: italic; font-weight: bold;">关注</span><span style="color: rgb(0, 255, 0); letter-spacing: 0px; font-style: italic; font-weight: bold;">沈理电协</span></span><span style="color: rgb(0, 0, 255); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">（微信：</span><span style="color: rgb(0, 255, 0); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">sylgdzxh</span><span style="color: rgb(0, 0, 255); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">）</span></p><p style="margin-top: 0px; margin-bottom: 0px; white-space: normal; padding: 0px; line-height: 25px; background-color: rgb(255, 255, 255);"><span style="color: rgb(0, 0, 255); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">每一次</span><span style="color: rgb(255, 0, 0); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">转发</span><span style="color: rgb(0, 0, 255); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">和</span><span style="color: rgb(255, 0, 0); letter-spacing: 0px; font-family: 宋体; font-style: italic; font-weight: bold;">分享</span><span style="color: rgb(0, 0, 255); letter-spacing: 0px; font-family: 宋体; font-weight: bold;">都是对我们的肯定。</span></p><p><span sty
